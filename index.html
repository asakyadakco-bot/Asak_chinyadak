<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>آساک چین یدک | ارتباط با ما</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;

      background-image:
        linear-gradient(
          rgba(20, 25, 30, 0.30),
          rgba(20, 25, 30, 0.30)
        ),
        url("asak.png.jpg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 15px;

      color: white;
    }

    .card {
      width: 100%;
      max-width: 440px;

      padding: 28px 20px 23px;

      text-align: center;

      background: rgba(255, 255, 255, 0.18);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      border: 1px solid rgba(255, 255, 255, 0.45);

      border-radius: 32px;

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.30),
        inset 0 1px 0 rgba(255, 255, 255, 0.40);
    }

    .logo {
      display: block;

      width: 110px;
      height: 110px;

      margin: 0 auto 17px;

      object-fit: contain;

      background: white;

      border-radius: 50%;

      border: 3px solid rgba(255, 255, 255, 0.75);

      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.30),
        0 0 0 5px rgba(255, 255, 255, 0.12);
    }

    h1 {
      margin: 0;

      font-size: 24px;
      font-weight: bold;

      color: white;

      text-shadow:
        0 2px 10px rgba(0, 0, 0, 0.35);
    }

    .subtitle {
      margin: 9px 0 24px;

      font-size: 13px;
      line-height: 1.8;

      color: rgba(255, 255, 255, 0.88);
    }

    .btn {
      display: flex;
      align-items: center;

      gap: 14px;

      width: 100%;

      padding: 14px;

      margin: 12px 0;

      text-decoration: none;

      color: white;

      background: rgba(255, 255, 255, 0.23);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      border: 1px solid rgba(255, 255, 255, 0.38);

      border-radius: 20px;

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);

      transition: all 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-3px);

      background: rgba(255, 255, 255, 0.34);

      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.20),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .icon {
      width: 50px;
      height: 50px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 16px;

      font-size: 24px;

      border: 1px solid rgba(255, 255, 255, 0.35);

      box-shadow:
        0 6px 18px rgba(0, 0, 0, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .wa {
      background: rgba(37, 211, 102, 0.78);
    }

    .ig {
      background: linear-gradient(
        135deg,
        rgba(131, 58, 180, .80),
        rgba(225, 48, 108, .80),
        rgba(253, 29, 29, .75)
      );
    }

    .bale {
      background: rgba(40, 135, 230, 0.78);
    }

    .web {
      background: rgba(40, 130, 80, 0.78);
    }

    .text {
      flex: 1;
      text-align: right;
    }

    .title {
      font-size: 16px;
      font-weight: bold;
      color: white;
    }

    .desc {
      margin-top: 5px;

      font-size: 11px;

      color: rgba(255, 255, 255, 0.76);
    }

    .arrow {
      font-size: 25px;
      color: rgba(255, 255, 255, 0.75);

      transition: 0.25s;
    }

    .btn:hover .arrow {
      transform: translateX(-5px);
      color: white;
    }

    /* بله - دو گزینه داخل یک کادر */
    .bale-container {
      display: flex;
      align-items: stretch;
      gap: 0;
      cursor: default;
    }

    .bale-option {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      cursor: pointer;
    }

    .bale-option .icon {
      width: 45px;
      height: 45px;
      font-size: 21px;
    }

    .bale-option .text {
      min-width: 0;
    }

    .bale-option .desc {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      direction: ltr;
      text-align: right;
    }

    .bale-divider {
      width: 1px;
      min-height: 45px;
      margin: 0 12px;
      background: rgba(255, 255, 255, 0.25);
    }

    /* فوتر */
    footer {
      margin-top: 21px;

      font-size: 10px;

      color: rgba(255, 255, 255, 0.65);
    }

    /* موبایل */
    @media (max-width: 480px) {

      body {
        padding: 12px;
      }

      .card {
        padding: 25px 16px 21px;
        border-radius: 29px;
      }

      .logo {
        width: 105px;
        height: 105px;
      }

      h1 {
        font-size: 23px;
      }

      .subtitle {
        font-size: 12px;
      }

      .btn {
        padding: 13px;
      }

      .icon {
        width: 48px;
        height: 48px;
      }

      .bale-option {
        gap: 7px;
      }

      .bale-option .icon {
        width: 42px;
        height: 42px;
        font-size: 19px;
      }

      .bale-divider {
        margin: 0 8px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <!-- لوگوی واقعی شرکت -->
    <img
      class="logo"
      src="asak.png.jpg"

    >

    <h1>

    </h1>

    <div class="subtitle">

    </div>

    <!-- واتساپ -->
    <a

    >
      <div class="icon wa">📞</div>

      <div class="text">
        <div class="title">واتساپ</div>
        <div class="desc">09926181912</div>
      </div>

      <div class="arrow">‹</div>
    </a>

    <!-- اینستاگرام -->
    <a

    >
      <div class="icon ig">📸</div>

      <div class="text">
        <div class="title">اینستاگرام</div>
        <div class="desc">asakchinyadak.ir</div>
      </div>

      <div class="arrow">‹</div>
    </a>

    <!-- سایت -->
    <a
      class="btn"

      rel="noopener"
    >
      <div class="icon web">🌐</div>

      <div class="text">
        <div class="title">سایت</div>
        <div class="desc">asakchinyadak.com</div>
      </div>

      <div class="arrow">‹</div>
    </a>
    
    <!-- بله - دو اکانت -->
    <div class="btn bale-container">

      <!-- بله اول -->
      <div
        class="bale-option"
        onclick="window.open('https://ble.ir/09911004749', '_blank')"
      >
        <div class="icon bale">📱</div>

        <div class="text">
          <div class="title">فروشگاه</div>
          <div class="desc">@09911004749</div>
        </div>
      </div>

      <div class="bale-divider"></div>

      <!-- بله دوم -->
      <div
        class="bale-option"
        onclick="window.open('https://ble.ir/asakyadak', '_blank')"
      >
        <div class="icon bale">📱</div>

        <div class="text">
          <div class="title">آساک چین</div>
          <div class="desc">@asakyadak</div>
        </div>
      </div>

    </div>

    <footer>
      آساک چین یدک
    </footer>

  </main>

</body>
</html>
